<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#ftGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#ftShadow)"/>

  <!-- Document / File Silhouette -->
  <path d="M38 30 L66 30 L82 46 L82 92 Q82 96 78 96 L38 96 Q34 96 34 92 L34 34 Q34 30 38 30 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <!-- Folded Corner -->
  <path d="M66 30 L66 46 L82 46 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Conversion Loop Arrows (Cyan/Emerald) -->
  <g fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arc clockwise -->
    <path d="M 48 58 A 14 14 0 0 1 72 58" />
    <polyline points="70,52 74,58 68,62" fill="#10b981"/>

    <!-- Bottom arc clockwise -->
    <path d="M 68 74 A 14 14 0 0 1 44 74" />
    <polyline points="46,80 42,74 48,70" fill="#10b981"/>
  </g>

  <!-- Search Magnifier Icon (Bottom Right Accent) -->
  <g transform="translate(68, 68)" filter="url(#ftShadow)">
    <circle cx="16" cy="16" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <line x1="25" y1="25" x2="36" y2="36" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>