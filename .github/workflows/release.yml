name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  # ── 1. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Tests before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  # ── 2. Build Linux binary ─────────────────────────────────────────────────────
  build-linux:
    name: Build Linux binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build
        run: |
          pip install -e . pyinstaller
          pyinstaller --onefile --name filetools --distpath dist/ filetools/__main__.py
          pyinstaller --onefile --name converter --distpath dist/ converter/__main__.py
          pyinstaller --onefile --name searcher  --distpath dist/ searcher/__main__.py
          tar -czf filetools-linux-x86_64.tar.gz -C dist filetools converter searcher
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: filetools-linux-x86_64.tar.gz

  # ── 3. Build Windows binary ───────────────────────────────────────────────────
  build-windows:
    name: Build Windows binaries
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build
        run: |
          pip install -e . pyinstaller
          pyinstaller --onefile --name filetools --distpath dist\ filetools\__main__.py
          pyinstaller --onefile --name converter --distpath dist\ converter\__main__.py
          pyinstaller --onefile --name searcher  --distpath dist\ searcher\__main__.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item install.bat, README.md, LICENSE dist\
          Compress-Archive -Path dist\filetools.exe, dist\converter.exe, dist\searcher.exe, dist\install.bat, dist\README.md, dist\LICENSE `
            -DestinationPath filetools-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: filetools-windows-x86_64.zip

  # ── 4. Build macOS binary ─────────────────────────────────────────────────────
  build-macos:
    name: Build macOS binaries
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + build
        run: |
          pip install -e . pyinstaller
          pyinstaller --onefile --name filetools --distpath dist/ filetools/__main__.py
          pyinstaller --onefile --name converter --distpath dist/ converter/__main__.py
          pyinstaller --onefile --name searcher  --distpath dist/ searcher/__main__.py
          tar -czf filetools-macos-x86_64.tar.gz -C dist filetools converter searcher
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: filetools-macos-x86_64.tar.gz

  # ── 5. Publish GitHub Release ─────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: linux }
      - uses: actions/download-artifact@v4
        with: { name: windows }
      - uses: actions/download-artifact@v4
        with: { name: macos }

      - name: Build source zip
        run: |
          zip -r filetools-source.zip . \
            --exclude "*/__pycache__/*" --exclude "*.pyc" \
            --exclude "*/.git/*"        --exclude "*/dist/*" \
            --exclude "*/.venv/*"       --exclude "*.egg-info/*" \
            --exclude "*/.pytest_cache/*" --exclude "*/build/*"

      - name: Extract tag version
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "FileTools ${{ steps.tag.outputs.version }}"
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: |
            filetools-linux-x86_64.tar.gz
            filetools-windows-x86_64.zip
            filetools-macos-x86_64.tar.gz
            filetools-source.zip
